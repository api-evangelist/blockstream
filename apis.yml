name: Blockstream
description: >-
  Blockstream is a Bitcoin infrastructure company whose products include the Liquid
  Network sidechain, the Green self-custody wallet, Blockstream Satellite, and
  Bitcoin mining and data services. For developers its flagship public API is
  Esplora, the open-source Bitcoin block explorer behind blockstream.info: a
  no-authentication HTTP REST API for reading blocks, transactions, addresses,
  scripthashes, the mempool, and fee estimates across Bitcoin mainnet, testnet, and
  signet, plus Liquid/Elements issued assets. Amounts are returned in satoshis and
  hashes are hex-encoded, with cursor pagination over confirmed transaction history.
  Blockstream also ships GDK, its open-source cross-platform wallet SDK.
