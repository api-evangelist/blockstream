note: >-
  Blockstream ships open-source developer libraries. GDK (Green Development Kit) is
  Blockstream's first-party cross-platform wallet SDK with Python and Java/JNI
  bindings. The Esplora HTTP API itself is a plain REST API consumed with any HTTP
  client; the widely used esplora-client Rust crate is maintained by the Bitcoin
  Dev Kit community (not Blockstream), so it is recorded here as community, not
  official.
